controls:
  - id: "GEN-001"
    name: "Governance & Policy"
    micro_requirements:
      - id: "policy_currency"
        prompt: "Evidence that security policies are current, approved, and reviewed at least annually."
        synonyms: ["policy review", "last updated", "approval", "annual review"]

  - id: "GEN-002"
    name: "Incident Response"
    micro_requirements:
      - id: "ir_testing"
        prompt: "Evidence of incident response testing (e.g., tabletop) and lessons learned."
        synonyms: ["tabletop", "simulation", "IR test", "after action"]